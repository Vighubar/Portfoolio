<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digiprojekt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kelly+Slab&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-labelledby="sidebar-title">
      <div class="sidebar__header">
        <h2 class="sidebar__title" id="sidebar-title">Projects</h2>
        <button class="sidebar__toggle" id="sidebar-toggle" type="button" aria-controls="board-list" aria-expanded="true" aria-label="Hide project list">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" fill="none" stroke="currentColor" stroke-width="2" /><path d="M8 3v14" stroke="currentColor" stroke-width="2" /></svg>
        </button>
      </div>
      <button class="sidebar__new" id="new-board" type="button" aria-label="New project">
        <span class="sidebar__new-icon" aria-hidden="true">+</span>
        <span class="sidebar__new-label">New project</span>
      </button>
      <div class="sidebar__history" id="board-list"></div>
      <button class="sidebar__share" id="share-open" type="button" aria-label="Share project">
        <svg class="sidebar__share-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="15" cy="4" r="2.5" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="5" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="15" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M7.2 8.8l5.6-3.4M7.2 11.2l5.6 3.4" stroke="currentColor" stroke-width="2" />
        </svg>
        <span class="sidebar__share-label">Share project</span>
      </button>
    </nav>

    <div class="scene-area">
      <div class="scene-wrap" id="scene-wrap">
        <div class="scene-sizer" id="scene-sizer"></div>
        <main class="scene" id="scene" aria-label="Projects">
          <img class="asset ground" src="ground.svg" alt="" width="938" height="820" style="left:0;top:204px" />
          <svg class="asset river" id="river" width="938" height="0" aria-hidden="true"></svg>

          <img class="asset" src="bush.svg" alt="" width="139" height="112" style="left:423px;top:422px" />
          <img class="asset" src="bush.svg" alt="" width="139" height="112" style="left:33px;top:192px" />
          <img class="asset" src="bush.svg" alt="" width="139" height="112" style="left:130px;top:915px" />
          <div id="more-bushes"></div>

          <svg class="boat-route" id="boat-route" width="0" height="0" aria-hidden="true"></svg>
          <img class="asset boat" id="boat" src="boat.svg" alt="" width="132" height="140" />
          <img class="asset" src="claud.svg" alt="" width="96" height="62" style="left:29px;top:17px" />
          <img class="asset" src="claud.svg" alt="" width="96" height="62" style="left:497px;top:109px" />
          <img class="asset" src="sun.svg" alt="" width="85" height="87" style="left:780px;top:28px" />

          <div id="projects"></div>

          <img class="asset" src="tree.svg" alt="" width="85" height="147" style="left:915px;top:174px" />
          <img class="asset" src="tree.svg" alt="" width="85" height="147" style="left:285px;top:569px" />
          <img class="asset" src="tree.svg" alt="" width="85" height="147" style="left:664px;top:760px" />
          <div id="more-trees"></div>
        </main>
      </div>
      <div class="shared-bar" id="shared-bar" hidden>
        <span>Viewing <strong id="shared-name"></strong> (view only)</span>
        <a class="shared-bar__exit" id="shared-exit" href="">open my planner</a>
      </div>
      <button class="add-house" id="add-house" type="button">
        <span class="add-house__icon" aria-hidden="true">+</span> Add house
      </button>
    </div>

    <aside class="diary" aria-labelledby="diary-title">
      <h1 class="diary__title" id="diary-title">Design diary</h1>
      <div class="diary__page">
        <ul class="diary__list" id="diary-list"></ul>
        <form class="diary__form" id="diary-form" autocomplete="off">
          <input class="diary__date" type="date" name="date" required aria-label="Entry date" />
          <input class="diary__input" type="text" name="text" placeholder="write an entry..." required aria-label="Entry text" />
          <button class="diary__add" type="submit" aria-label="Add entry">+</button>
        </form>
      </div>
    </aside>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <header class="modal__header">
        <input class="modal__name" id="modal-name" type="text" maxlength="24" aria-label="Project name" />
        <button class="modal__close" type="button" data-close aria-label="Close">&times;</button>
      </header>
      <ul class="modal__tasks" id="modal-tasks"></ul>
      <form class="modal__form" id="task-form" autocomplete="off">
        <input class="modal__date" type="date" name="date" required aria-label="Task date" />
        <input class="modal__input" type="text" name="text" placeholder="new task..." required aria-label="Task text" />
        <button class="modal__add" type="submit">add</button>
      </form>
      <button class="modal__remove" id="remove-house" type="button">delete house</button>
    </section>
  </div>

  <div class="modal" id="share-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <section class="modal__panel share" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <header class="modal__header">
        <h2 class="share__title" id="share-title">Share project</h2>
        <button class="modal__close" type="button" data-close aria-label="Close">&times;</button>
      </header>
      <div class="share__body">
        <fieldset class="share__modes">
          <legend class="share__legend">People with the link can</legend>
          <label class="share__mode">
            <input type="radio" name="share-mode" value="view" checked />
            <span><span class="share__mode-name">View</span> see the houses, tasks and diary without changing them</span>
          </label>
          <label class="share__mode">
            <input type="radio" name="share-mode" value="edit" />
            <span><span class="share__mode-name">Edit</span> get their own copy to change; your project stays as it is</span>
          </label>
        </fieldset>
        <div class="share__link">
          <input class="share__url" id="share-url" type="text" readonly aria-label="Share link" />
          <button class="modal__add" id="share-copy" type="button">copy link</button>
        </div>
        <p class="share__note">The link is a snapshot of the project right now. Share again after making changes.</p>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <template id="house-template">
    <div class="project">
      <button class="house" type="button">
        <svg class="house__art" width="148" height="80" viewBox="0 0 148 80" aria-hidden="true">
          <rect x="12.5513" y="34.3333" width="122.176" height="44.6667" fill="#D0BDB3" stroke="#8B7C74" stroke-width="2" />
          <path d="M136.07 33.3887H11.9297L74 0.56543L136.07 33.3887Z" fill="#CF4545" stroke="#993030" />
        </svg>
        <span class="house__name"></span>
      </button>
      <div class="sign">
        <div class="sign__board">
          <span class="sign__text"></span>
          <label class="sign__check">
            <input type="checkbox" />
            <span class="sign__box" aria-hidden="true"></span>
          </label>
        </div>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
